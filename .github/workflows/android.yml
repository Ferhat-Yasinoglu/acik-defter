# ==========================================================================
# NetStore — Android kurulum dosyasi (.apk)
#
# Uygulama Trusted Web Activity olarak paketlenir: telefondaki Chrome
# motorunu kullanir, kendi WebView'ini tasimaz. Google girisinin calismasi
# bu ayrima bagli — gomulu WebView'ler disallowed_useragent hatasi verir.
#
# Imza anahtari:
#   ANDROID_KEYSTORE_B64 gizli anahtari varsa o kullanilir.
#   Yoksa is akisi kendisi bir anahtar uretir, APK'yi imzalar ve anahtari
#   "imza-anahtari" adiyla ayri bir dosya olarak birakir. O dosyayi gizli
#   anahtar olarak eklersen sonraki surumler ayni imzayla cikar ve
#   guncellemeler sorunsuz olur.
# ==========================================================================

name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android bilesenlerini kur
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Imza anahtarini hazirla
        id: key
        env:
          B64:  ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KPASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          KS="$RUNNER_TEMP/signing/netstore.keystore"
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$KS"
            echo "store_pass=$PASS" >> "$GITHUB_OUTPUT"
            echo "key_pass=${KPASS:-$PASS}" >> "$GITHUB_OUTPUT"
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Kayitli imza anahtari kullaniliyor." >> "$GITHUB_STEP_SUMMARY"
          else
            GEN="$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)"
            keytool -genkeypair -noprompt \
              -keystore "$KS" -alias netstore \
              -storepass "$GEN" -keypass "$GEN" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NetStore, O=NetStore, C=TR"
            echo "::add-mask::$GEN"
            echo "store_pass=$GEN" >> "$GITHUB_OUTPUT"
            echo "key_pass=$GEN" >> "$GITHUB_OUTPUT"
            echo "generated=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$GEN" > "$RUNNER_TEMP/signing/parola.txt"
            base64 -w0 "$KS" > "$RUNNER_TEMP/signing/keystore.base64.txt"
          fi
          echo "path=$KS" >> "$GITHUB_OUTPUT"

      - name: APK uret
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          KEYSTORE_PASS: ${{ steps.key.outputs.store_pass }}
          KEY_ALIAS: netstore
          KEY_PASS: ${{ steps.key.outputs.key_pass }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: gradle --no-daemon assembleRelease

      - name: Manifest sinif adlarini dogrula
        run: |
          # Derleme, manifest'teki sinif adlarini kontrol etmez: yanlis bir ad
          # ancak telefonda acilirken cokerek ortaya cikar. Burada AAR'in
          # icindeki siniflari okuyup gercekten var olduklarini dogruluyoruz.
          AAR="$(find ~/.gradle/caches -name 'androidbrowserhelper-2.5.0.aar' | head -1)"
          echo "AAR: $AAR"
          T="$RUNNER_TEMP/aar"; mkdir -p "$T"; unzip -o -q "$AAR" -d "$T"
          for C in com.google.androidbrowserhelper.trusted.LauncherActivity \
                   com.google.androidbrowserhelper.trusted.DelegationService; do
            echo "--- $C"
            javap -classpath "$T/classes.jar" "$C" | head -2 \
              || { echo "::error::$C kitaplikta yok"; exit 1; }
          done

      - name: Dosyayi adlandir ve dogrula
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          cp "$APK" NetStore.apk
          ls -lh NetStore.apk
          BT="$(ls -d $ANDROID_HOME/build-tools/* | tail -1)"
          "$BT/apksigner" verify --print-certs NetStore.apk | tee certs.txt
          {
            echo "### APK hazir"
            echo ""
            echo "Boyut: $(du -h NetStore.apk | cut -f1)"
            echo ""
            echo "Adres cubugunun gizlenmesi icin asagidaki parmak izini"
            echo '`assetlinks.json` icine yaz:'
            echo ""
            echo '```'
            grep -i 'SHA-256' certs.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: NetStore-apk
          path: NetStore.apk

      - name: Uretilen imza anahtarini birak
        if: steps.key.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: imza-anahtari
          path: ${{ runner.temp }}/signing/
          retention-days: 90

      - name: Surume ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NetStore.apk
