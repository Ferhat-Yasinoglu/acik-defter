plugins { id 'com.android.application' }

android {
  namespace 'io.github.ferhatyasinoglu.netstore'
  compileSdk 34

  defaultConfig {
    applicationId 'io.github.ferhatyasinoglu.netstore'
    minSdk 21
    targetSdk 34
    versionCode  Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
    versionName  System.getenv('VERSION_NAME') ?: '1.0.0'
  }

  /* Imza bilgileri ortam degiskenlerinden gelir; depoda parola durmaz. */
  signingConfigs {
    release {
      storeFile     file(System.getenv('KEYSTORE_PATH') ?: 'netstore.keystore')
      storePassword System.getenv('KEYSTORE_PASS')
      keyAlias      System.getenv('KEY_ALIAS') ?: 'netstore'
      keyPassword   System.getenv('KEY_PASS')
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

/* androidbrowserhelper kotlin-stdlib-jdk7/jdk8 1.6.21, appcompat ise
   kotlin-stdlib 1.8.22 getiriyor. Kotlin 1.8'de jdk7/jdk8 siniflari ana
   pakete tasindigi icin ikisi cakisiyor ve derleme "Duplicate class" ile
   duruyor. jdk7/jdk8'i 1.8.22'ye sabitlemek onlari bos kabuga cevirir. */
configurations.all {
  resolutionStrategy {
    force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
  }
}

dependencies {
  implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
  implementation 'androidx.appcompat:appcompat:1.7.0'
}
