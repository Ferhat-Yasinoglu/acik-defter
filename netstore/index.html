<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1120" />
  <meta name="description" content="NetStore — stok, satış, müşteri, borç ve tahsilat yönetim paneli" />
  <title>NetStore</title>
  <link rel="stylesheet" href="css/netstore.css" />

  <!-- Telefona kurulabilir uygulama (PWA): ana ekrana eklenince tam ekran açılır. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="NetStore" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237C3AED'/><path d='M9 22V10l14 12V10' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>

  <div class="app">

    <!-- ================= Kenar çubuğu ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 19V5l14 14V5"/>
          </svg>
        </span>
        <div style="min-width:0">
          <div class="brand-name" id="brandName">NetStore</div>
          <div class="brand-sub" id="brandSub">Panel</div>
        </div>
        <button class="icon-btn nav-close" id="btnNavClose" data-nav="close">
          <span data-icon="x"></span>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav"></nav>

      <div class="sidebar-foot">
        <a class="user-chip" href="#/ayarlar">
          <span class="avatar" id="meAvatar">FY</span>
          <span style="min-width:0">
            <span class="name" id="meName" style="display:block"></span>
            <span class="role" id="meRole"></span>
          </span>
          <span class="chip-caret" data-icon="chevronRight"></span>
        </a>
      </div>
    </aside>

    <!-- ================= Ana alan ================= -->
    <div class="main">

      <header class="topbar">
        <button class="icon-btn hamburger" id="btnBurger" data-nav="open">
          <span data-icon="menu"></span>
        </button>

        <div class="topbar-title">
          <h1 id="pageTitle"></h1>
          <div class="crumb" id="pageCrumb"></div>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn search-toggle" id="btnSearchToggle" data-act="search-toggle">
            <span data-icon="search"></span>
          </button>
          <div class="search">
            <span class="search-lens" data-icon="search"></span>
            <input type="search" id="searchInput" autocomplete="off" />
            <div class="search-panel" id="searchPanel"></div>
          </div>
          <div id="langSwitch"></div>
          <button class="icon-btn" id="btnNotif">
            <span data-icon="bell"></span>
            <span class="dot"></span>
          </button>
          <button class="icon-btn" id="btnHelp">
            <span data-icon="info"></span>
          </button>
        </div>
      </header>

      <main class="page" id="page"></main>
    </div>

  </div>

  <div class="scrim" data-nav="close" aria-hidden="true"></div>
  <div class="doc-host" id="docHost" role="dialog" aria-modal="true"></div>
  <div class="modal-host" id="modalHost" role="dialog" aria-modal="true"></div>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/invoice.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>

  <script>
    /* Servis çalışanı yalnızca https:// veya localhost üzerinde çalışır;
       dosyadan (file://) açıldığında sessizce atlanır. */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .catch(function () { /* çevrimdışı desteği yok — uygulama yine de çalışır */ });
      });
    }
  </script>
</body>
</html>
