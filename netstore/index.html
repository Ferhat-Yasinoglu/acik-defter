<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1120" />
  <meta name="description" content="NetStore — stok, satış, müşteri, borç ve tahsilat yönetim paneli" />
  <title>NetStore — Dashboard</title>
  <link rel="stylesheet" href="css/netstore.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237C3AED'/><path d='M9 22V10l14 12V10' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>

  <div class="app">

    <!-- ================= Kenar çubuğu ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 19V5l14 14V5"/>
          </svg>
        </span>
        <div style="min-width:0">
          <div class="brand-name">NetStore</div>
          <div class="brand-sub">Yönetim Paneli</div>
        </div>
        <button class="icon-btn nav-close" data-nav="close" aria-label="Menüyü kapat">
          <span data-icon="x"></span>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav" aria-label="Ana menü"></nav>

      <div class="sidebar-foot">
        <a class="user-chip" href="#/ayarlar">
          <span class="avatar">FY</span>
          <span style="min-width:0">
            <span class="name" style="display:block">Ferhat Yaqoobi</span>
            <span class="role">Mağaza Müdürü</span>
          </span>
          <span style="margin-left:auto;color:var(--text-3)" data-icon="chevronRight"></span>
        </a>
      </div>
    </aside>

    <!-- ================= Ana alan ================= -->
    <div class="main">

      <header class="topbar">
        <button class="icon-btn hamburger" data-nav="open" aria-label="Menüyü aç">
          <span data-icon="menu"></span>
        </button>

        <div class="topbar-title">
          <h1 id="pageTitle">Dashboard</h1>
          <div class="crumb" id="pageCrumb">Genel bakış</div>
        </div>

        <div class="topbar-actions">
          <div class="search">
            <span data-icon="search"></span>
            <input type="search" placeholder="Ürün, müşteri veya fatura ara…" aria-label="Ara" />
          </div>
          <button class="icon-btn" aria-label="Bildirimler">
            <span data-icon="bell"></span>
            <span class="dot"></span>
          </button>
          <button class="icon-btn" aria-label="Yardım">
            <span data-icon="info"></span>
          </button>
        </div>
      </header>

      <main class="page" id="page"></main>
    </div>

  </div>

  <div class="scrim" data-nav="close" aria-hidden="true"></div>
  <div class="modal-host" id="modalHost" role="dialog" aria-modal="true"></div>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
